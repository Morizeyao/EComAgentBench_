[project]
name = "ecom-agent-bench"
version = "0.1.0"
description = "EComAgentBench: A Reproducible Benchmark for E-Commerce Shopping Agents with Distributed Hidden User Intent"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.86.0",
    "google-genai>=1.68.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.25.0",
]

[tool.uv]
prerelease = "allow"
